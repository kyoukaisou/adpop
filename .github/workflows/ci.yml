name: CI

on:
  pull_request:
  push:
    branches: [main]

# public リポジトリでは fork からの PR も CI を起こせる。既定の権限を持ち回らないよう
# 最小(読み取りのみ)を明示する。⚠ いま `GITHUB_TOKEN` を使う step は0本なので、
# これでジョブの挙動は変わらない。書き込みが要る job ができたら、その job にだけ足す。
permissions:
  contents: read

# 同じ枝への push が続いたら、古い実行は打ち切る(Actions の枠を食い潰さないため)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # 🔴 ここに **anon の権限の実測**(supabase/tests/schema.test.ts)と、
      #   **埋め込みスクリプトを束ねて実行する検査**(tests/embed-safety.test.ts)が入っている。
      #   ⚠ 後者は step の中で `scripts/build-embed.mjs` を別プロセスで走らせる
      #     (esbuild は jsdom の中では動かない)。
      #   マイグレーションを PGlite へ通しで流し、
      #   「anon / service_role / PUBLIC が1つも触れないこと」「RLS が有効なこと」を毎 PR 測る。
      #   ⚠ Docker も Supabase の認証情報も要らない。
      - name: test
        run: npm test

      # 埋め込みスクリプトの gzip 上限(要件書 §5-1)。
      # ⚠ PR2 で中身が入ったので、ここは**実物を測っている**(PR1 のあいだは空を測っていた)。
      #   判定そのものは tests/bundle-size.test.ts が両側(超える / 超えない)で固定している。
      - name: 埋め込みスクリプトのサイズ上限
        run: npm run check:bundle-size

      # packages/embed(MIT)が AGPL 側を読んでいないこと(要件書 §5-6)
      - name: ライセンス分割(依存の向き)
        run: npm run check:embed-independence

      - name: build
        run: npm run build

  # ══════════════════════════════════════════════════════════════════════
  # 🔴 実物の Supabase(PostgREST + PostgreSQL)を1度だけ通す
  # ══════════════════════════════════════════════════════════════════════
  # 上の `test` は PGlite に**手書きで再現した開始ACL**からマイグレーションを流す。
  # **その再現が Supabase の実物とずれたら、検査は「ずれた前提」を測り続ける**(測る対象の取り違え)。
  # → anon キーと service_role キーで業務テーブルに当たり、**HTTP と SQLSTATE の両方**を突き合わせる。
  # ⚠ 接続失敗・鍵が取れない・想定外のコードは**全部不合格**(繋がらないことを緑にしない)。
  #
  # 🔴 **両向きを同じジョブで測る**:
  #   ・どの API キーからも配信の関数に**届かない**こと(PostgREST は経路から外した)
  #   ・**専用の Postgres ロールからは届く**こと(配り漏れると配信だけが静かに止まる)
  #   ⚠ 前の版は「service_role の鍵で届くのは関数2本だけ」と書いていたが、
  #     測っていたのは `/rest/v1` の `public` だけで、**Auth と Storage を1バイトも測っていなかった**。
  postgrest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Docker は ubuntu-latest に入っている。ここで 0001 → 0002 が適用される。
      - name: supabase start
        run: supabase start

      - name: 実物の PostgREST に anon / service_role で当たる(届かないこと)
        run: npm run check:postgrest

      # 🔴 **逆向き**: 配信専用の Postgres ロールで実際につないで、
      #   できること2件 / できないこと8件(表・auth.users・allow-list 外の関数・set role・create table)を撃つ。
      #   ⚠ 「届かないこと」だけを測ると、**配り漏れ = 配信だけが静かに止まる**を検出できない。
      - name: 配信専用ロールで DB へ直接つないで両向きを撃つ
        run: npm run check:delivery-role

      - name: supabase stop
        if: always()
        run: supabase stop
