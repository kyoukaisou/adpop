name: CI

on:
  pull_request:
  push:
    branches: [main]

# public リポジトリでは fork からの PR も CI を起こせる。既定の権限を持ち回らないよう
# 最小(読み取りのみ)を明示する。⚠ いま `GITHUB_TOKEN` を使う step は0本なので、
# これでジョブの挙動は変わらない。書き込みが要る job ができたら、その job にだけ足す。
permissions:
  contents: read

# 同じ枝への push が続いたら、古い実行は打ち切る(Actions の枠を食い潰さないため)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # 🔴 ここに **D1 の実測**(tests/d1-*.test.ts)と、**埋め込みスクリプトを束ねて実行する検査**が入っている。
      #   D1 は `wrangler d1 migrations apply --local`(本番と同じ適用の仕方)で作った型紙を複写して使い、
      #   wrangler が起動する workerd の中の実物の D1 に当てる(tests/setup/d1-template.ts)。
      #   ⚠ Cloudflare のアカウントも認証情報も要らない(全部ローカル)。
      - name: test
        run: npm test
        env:
          WRANGLER_SEND_METRICS: "false"

      # 埋め込みスクリプトの gzip 上限(要件書 §5-1)。
      # ⚠ PR2 で中身が入ったので、ここは**実物を測っている**(PR1 のあいだは空を測っていた)。
      #   判定そのものは tests/bundle-size.test.ts が両側(超える / 超えない)で固定している。
      - name: 埋め込みスクリプトのサイズ上限
        run: npm run check:bundle-size

      # packages/embed(MIT)が AGPL 側を読んでいないこと(要件書 §5-6)
      - name: ライセンス分割(依存の向き)
        run: npm run check:embed-independence

      - name: build
        run: npm run build

      # 🔴 両 Worker の build.command には、本番向けの検査(database_id の仮の値を断る・
      #   配信元が deploy/delivery-origin.txt の確定値と完全一致するかを見る)を**省略する経路が
      #   無い**(前巡の `CI_DRY_RUN` フラグは、そのフラグを立てたまま `wrangler deploy` を直接
      #   実行すれば本番でも検査を回避できる欠陥だったため削除した。Codex r3 Blocker)。
      #   このリポジトリはまだ本番の D1 を作っておらず(database_id は仮の値のまま)、配信元も
      #   確定していない(deploy/delivery-origin.txt は UNSET のまま。docs/deploy.md §2・§5)ので、
      #   CI がこのまま dry-run しても検査は必ず落ちる。
      #   このステップは、**コミットしない一時的な書き換え**を CI ジョブのワークスペースの中だけに行い、
      #   検査を通常の経路のまま(省略せず)満たす。使う値は本番の値になりえない形にする:
      #   - `database_id` には `.workers.dev`/UUID のどちらにも見えない固定の文字列を使う
      #   - 配信元には RFC 2606 が予約する `.invalid` ドメインを使う(Cloudflare は絶対にこの
      #     ドメインを発行しないので、本番の値と構文的にも衝突しない)
      #   ジョブが終わればランナーごと消えるので、これらの値がコミットや本番の deploy に渡ることは無い。
      #   ⚠ 既に本番の database_id / 確定した配信元がコミットされていれば(deploy 後)、下の sed は
      #   何も一致せず素通りする(real な値のまま検査されるのが正しい挙動)。
      - name: database_id・配信元に CI 専用の値を一時的に入れる(コミットしない)
        run: |
          sed -i 's/00000000-0000-4000-8000-000000000000/ci-dryrun-not-a-real-database-id/' \
            wrangler.delivery.jsonc wrangler.admin.jsonc
          if [ "$(cat deploy/delivery-origin.txt)" = "UNSET" ]; then
            printf '%s' "https://adpop-delivery.ci-dryrun.invalid" > deploy/delivery-origin.txt
          fi

      # 配信の Worker を、デプロイと同じ束ね方で束ねる(アップロードはしない = 認証は要らない)。
      # ⚠ 束ねられないもの(Node 専用の import など)はここで落ちる。
      - name: 配信の Worker を束ねる(dry-run)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/delivery-worker" -c wrangler.delivery.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"

      # 🔴 `NEXT_PUBLIC_DELIVERY_ORIGIN` は、1つ前のステップで(必要なら)書き換えた
      #   `deploy/delivery-origin.txt` の値と完全一致させる(シェルでファイルから読む。
      #   YAML の `env:` は静的な文字列しか書けないため、ここは `run:` の中で評価する)。
      - name: 管理画面の Worker を束ねる(dry-run)
        run: |
          NEXT_PUBLIC_DELIVERY_ORIGIN="$(cat deploy/delivery-origin.txt)" \
            npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/admin-worker" -c wrangler.admin.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"
