name: CI

on:
  pull_request:
  push:
    branches: [main]

# public リポジトリでは fork からの PR も CI を起こせる。既定の権限を持ち回らないよう
# 最小(読み取りのみ)を明示する。⚠ いま `GITHUB_TOKEN` を使う step は0本なので、
# これでジョブの挙動は変わらない。書き込みが要る job ができたら、その job にだけ足す。
permissions:
  contents: read

# 同じ枝への push が続いたら、古い実行は打ち切る(Actions の枠を食い潰さないため)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # 本番で動く依存(`dependencies`)に High 以上の advisory が出たら落とす。
      # dev 専用の依存(lint/test の道具)はここでは見ない——本番の Worker には入らないため
      # (根拠: notes/本部/セキュリティ監査-ADPOP-依存-2026-10-10.md)。
      # ⚠ dev 側の advisory(例: `braces` の修正版なし)は、ここでは意図的に見逃している。
      - name: npm audit(本番依存のみ・High 以上で失敗)
        run: npm audit --omit=dev --audit-level=high

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # 🔴 ここに **D1 の実測**(tests/d1-*.test.ts)と、**埋め込みスクリプトを束ねて実行する検査**が入っている。
      #   D1 は `wrangler d1 migrations apply --local`(本番と同じ適用の仕方)で作った型紙を複写して使い、
      #   wrangler が起動する workerd の中の実物の D1 に当てる(tests/setup/d1-template.ts)。
      #   ⚠ Cloudflare のアカウントも認証情報も要らない(全部ローカル)。
      - name: test
        run: npm test
        env:
          WRANGLER_SEND_METRICS: "false"

      # 埋め込みスクリプトの gzip 上限(要件書 §5-1)。
      # ⚠ PR2 で中身が入ったので、ここは**実物を測っている**(PR1 のあいだは空を測っていた)。
      #   判定そのものは tests/bundle-size.test.ts が両側(超える / 超えない)で固定している。
      - name: 埋め込みスクリプトのサイズ上限
        run: npm run check:bundle-size

      # packages/embed(MIT)が AGPL 側を読んでいないこと(要件書 §5-6)
      - name: ライセンス分割(依存の向き)
        run: npm run check:embed-independence

      - name: build
        run: npm run build

      # 🔴 両 Worker の build.command には、本番向けの検査(database_id の仮の値を断る・配信元が
      #   deploy/delivery-origin.txt の確定値と完全一致するかを見る・Custom Domain のホストが
      #   確定値と一致し workers_dev が false か見る)を**省略する経路が無い**(前巡の `CI_DRY_RUN`
      #   フラグは、そのフラグを立てたまま `wrangler deploy` を直接実行すれば本番でも検査を回避
      # できる欠陥だったため削除した。レビュー指摘)。
      #   配信元(deploy/delivery-origin.txt)・database_id ともに、すでに確定した実在の値が
      #   コミットされている。CI はこの値を書き換えず、通常の経路のまま
      #   dry-run する(コミットされた確定値そのものは秘密ではなく、Cloudflare に接続しない
      #   dry-run へ渡しても実害が無いため)。

      # 配信の Worker を、デプロイと同じ束ね方で束ねる(アップロードはしない = 認証は要らない)。
      # ⚠ 束ねられないもの(Node 専用の import など)はここで落ちる。
      - name: 配信の Worker を束ねる(dry-run)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/delivery-worker" -c wrangler.delivery.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"

      # 🔴 `NEXT_PUBLIC_DELIVERY_ORIGIN` は `deploy/delivery-origin.txt` の確定値と完全一致させる
      #   (シェルでファイルから読む。YAML の `env:` は静的な文字列しか書けないため、
      #   ここは `run:` の中で評価する)。
      - name: 管理画面の Worker を束ねる(dry-run)
        run: |
          NEXT_PUBLIC_DELIVERY_ORIGIN="$(cat deploy/delivery-origin.txt)" \
            npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/admin-worker" -c wrangler.admin.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"
