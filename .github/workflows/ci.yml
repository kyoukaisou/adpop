name: CI

on:
  pull_request:
  push:
    branches: [main]

# public リポジトリでは fork からの PR も CI を起こせる。既定の権限を持ち回らないよう
# 最小(読み取りのみ)を明示する。⚠ いま `GITHUB_TOKEN` を使う step は0本なので、
# これでジョブの挙動は変わらない。書き込みが要る job ができたら、その job にだけ足す。
permissions:
  contents: read

# 同じ枝への push が続いたら、古い実行は打ち切る(Actions の枠を食い潰さないため)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # 🔴 ここに **anon の権限の実測**が入っている(supabase/tests/schema.test.ts)。
      #   マイグレーションを PGlite へ通しで流し、
      #   「anon / service_role / PUBLIC が1つも触れないこと」「RLS が有効なこと」を毎 PR 測る。
      #   ⚠ Docker も Supabase の認証情報も要らない。
      - name: test
        run: npm test

      # 埋め込みスクリプトの gzip 上限(要件書 §5-1)。⚠ PR1 では中身が空なので、
      # まだ何も守っていない(判定そのものは tests/bundle-size.test.ts が両側で固定している)。
      - name: 埋め込みスクリプトのサイズ上限
        run: npm run check:bundle-size

      # packages/embed(MIT)が AGPL 側を読んでいないこと(要件書 §5-6)
      - name: ライセンス分割(依存の向き)
        run: npm run check:embed-independence

      - name: build
        run: npm run build

  # ══════════════════════════════════════════════════════════════════════
  # 🔴 実物の Supabase(PostgREST + PostgreSQL)を1度だけ通す
  # ══════════════════════════════════════════════════════════════════════
  # 上の `test` は PGlite に**手書きで再現した開始ACL**からマイグレーションを流す。
  # **その再現が Supabase の実物とずれたら、検査は「ずれた前提」を測り続ける**(測る対象の取り違え)。
  # → anon キーと service_role キーで業務テーブルに当たり、**HTTP と SQLSTATE の両方**を突き合わせる。
  # ⚠ 接続失敗・鍵が取れない・想定外のコードは**全部不合格**(繋がらないことを緑にしない)。
  postgrest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Docker は ubuntu-latest に入っている。ここで 0001 → 0002 が適用される。
      - name: supabase start
        run: supabase start

      - name: 実物の PostgREST に anon / service_role で当たる
        run: npm run check:postgrest

      - name: supabase stop
        if: always()
        run: supabase stop
